<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Socketbound Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* One column of review cards, newest open item first; closed items folded below. */
  :root {
    --bg: #15120f; --panel: #1f1a15; --line: #3a3027; --fg: #ece2d3; --muted: #a7998a;
    --ember: #e08a3c; --ok: #8fbf7a; --warn: #e0b04a;
    --display: "Cormorant Garamond", Georgia, serif;
    --body: "Source Sans 3", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body);
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 860px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font: 600 2rem/1.1 var(--display); margin: 0; letter-spacing: .01em; }
  .lede { margin: 4px 0 0; color: var(--muted); }
  .count { color: var(--ember); font-weight: 600; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .chip { border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; }
  .chip.open { color: var(--warn); } .chip.final { color: var(--ember); } .chip.done { color: var(--ok); }
  .card h2 { font: 600 1.45rem/1.15 var(--display); margin: 0; text-wrap: balance; }
  .ask { margin: 0; font-weight: 600; }
  .body { margin: 0; padding-left: 18px; color: var(--fg); }
  .body li { margin: 2px 0; }
  .media { display: grid; gap: 12px; }
  figure { margin: 0; display: grid; gap: 4px; }
  figure video, figure img { width: 100%; max-width: 100%; border-radius: 4px; background: #000; display: block; }
  figcaption { font-size: .85rem; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts a { color: var(--bg); background: var(--ember); text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 4px; min-height: 44px; display: inline-flex; align-items: center; }
  .opts a.alt { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .opts a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .hint { font-size: .8rem; color: var(--muted); margin: 0; }
  .picked { margin: 0; color: var(--ok); font-weight: 600; }
  details { border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; color: var(--muted); }
  .empty { color: var(--muted); }
  .stamp { font-size: .75rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Socketbound Review</h1>
    <p class="lede"><span class="count" id="n">0</span> to look at. Tap a choice: it opens a short GitHub note, press Submit and the team picks it up.</p>
  </header>
  <section id="open"><p class="empty">Loading…</p></section>
  <details id="closedwrap" hidden>
    <summary>Answered</summary>
    <div id="closed" style="display:grid;gap:20px;margin-top:12px"></div>
  </details>
  <p class="stamp" id="stamp"></p>
</main>
<script>
const REPO = "Lechkolion/socketbound-review";
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
function card(it) {
  const c = el("article", "card"); c.id = it.id;
  const m = el("div", "meta");
  m.append(el("span", "chip " + (it.picked ? "done" : it.kind === "final" ? "final" : "open"), it.picked ? "Answered" : it.kind === "final" ? "Final check" : "Approve"));
  m.append(el("span", null, it.area || ""));
  m.append(el("span", null, (it.created || "").slice(0, 16).replace("T", " ")));
  c.append(m, el("h2", null, it.title));
  if (it.ask) c.append(el("p", "ask", it.ask));
  if (it.body && it.body.length) { const ul = el("ul", "body"); it.body.forEach(b => ul.append(el("li", null, b))); c.append(ul); }
  const md = el("div", "media");
  (it.media || []).forEach(x => {
    const f = el("figure");
    let v;
    if (/\.(mp4|webm)$/i.test(x.src)) { v = el("video"); v.src = x.src; v.controls = true; v.loop = true; v.muted = true; v.playsInline = true; v.preload = "metadata"; }
    else { v = el("img"); v.src = x.src; v.alt = x.caption || ""; v.loading = "lazy"; }
    f.append(v, el("figcaption", null, x.caption || ""));
    md.append(f);
  });
  c.append(md);
  if (it.picked) c.append(el("p", "picked", "Your pick: " + it.picked));
  else if (it.options && it.options.length) {
    const o = el("div", "opts");
    it.options.forEach((opt, i) => {
      const a = el("a", i === it.options.length - 1 && /wrong|neither|no/i.test(opt) ? "alt" : null, opt);
      a.href = "https://github.com/" + REPO + "/issues/new?title=" + encodeURIComponent(it.id + ": " + opt) + "&body=" + encodeURIComponent("Pick: " + opt + "\n\nNotes (optional):\n");
      a.target = "_blank"; a.rel = "noopener";
      o.append(a);
    });
    c.append(o, el("p", "hint", "Add a note on the GitHub page if you want, then Submit."));
  }
  return c;
}
fetch("items.json?" + Date.now()).then(r => r.json()).then(d => {
  const items = (d.items || []).slice().sort((a, b) => (b.created || "").localeCompare(a.created || ""));
  const open = items.filter(i => !i.picked), closed = items.filter(i => i.picked);
  const o = document.getElementById("open"); o.replaceChildren(); o.style.display = "grid"; o.style.gap = "20px";
  if (!open.length) o.append(el("p", "empty", "Nothing waiting on you right now."));
  open.forEach(i => o.append(card(i)));
  document.getElementById("n").textContent = open.length;
  if (closed.length) { document.getElementById("closedwrap").hidden = false; closed.forEach(i => document.getElementById("closed").append(card(i))); }
  document.getElementById("stamp").textContent = "Updated " + (d.updated || "").replace("T", " ").slice(0, 16);
}).catch(() => { document.getElementById("open").replaceChildren(el("p", "empty", "Could not load the list. Pull to refresh.")); });
</script>
</body>
</html>
